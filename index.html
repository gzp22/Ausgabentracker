<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg: #0a0b10;
      --surface: #131620;
      --surface-2: #1b1f2d;
      --border: #242a3b;
      --text: #e8ebf5;
      --muted: #7a8299;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --success: #34d399;
      --danger: #f43f5e;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(139, 92, 246, 0.18), transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(34, 211, 238, 0.12), transparent 40%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 18px;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fff 30%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    /* Fortschritt */
    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .progress-label {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .progress-value {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 10px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.5);
    }

    .progress-note {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    /* Formular */
    form {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder { color: #4b5263; }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }

    .btn-add {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
    }

    .btn-add:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }

    /* Listen-Kopf mit Aktion */
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .list-title {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .btn-clear:hover:not(:disabled) {
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.08);
    }

    .btn-clear:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      animation: slideIn 0.3s ease;
    }

    li:hover {
      border-color: #353d55;
      transform: translateX(2px);
    }

    li.done {
      border-color: rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.05);
    }

    .check {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 2px solid #3a4259;
      display: grid;
      place-items: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .check svg {
      width: 14px;
      height: 14px;
      stroke: #04130d;
      stroke-width: 3.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      transition: stroke-dashoffset 0.3s ease 0.05s;
    }

    li.done .check {
      background: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.45);
    }

    li.done .check svg { stroke-dashoffset: 0; }

    .habit-name {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      transition: color 0.2s, opacity 0.2s;
    }

    li.done .habit-name {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: rgba(122, 130, 153, 0.6);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #4b5263;
      font-size: 1.3rem;
      line-height: 1;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.1);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 10px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
    }

    /* Konfetti */
    .confetti {
      position: fixed;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 999;
      will-change: transform, opacity;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 32px 12px; }
      header h1 { font-size: 1.6rem; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Habit Tracker</h1>
      <p>Kleine Schritte, jeden Tag.</p>
    </header>

    <section class="card">
      <div class="progress-head">
        <span class="progress-label">Heutiger Fortschritt</span>
        <span class="progress-value" id="percent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="fill"></div>
      </div>
      <p class="progress-note" id="note"></p>
    </section>

    <section class="card">
      <form id="habit-form" autocomplete="off">
        <input type="text" id="habit-input" placeholder="Neue Gewohnheit, z. B. Wasser trinken" maxlength="60" required>
        <button type="submit" class="btn-add">Hinzufügen</button>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <div class="list-title">Deine Gewohnheiten</div>
        <button type="button" class="btn-clear" id="clear-done" disabled>Erledigte löschen</button>
      </div>
      <ul id="habit-list"></ul>
      <div class="empty" id="empty" hidden>Noch keine Gewohnheiten. Füge oben deine erste hinzu.</div>
    </section>
  </div>

  <script>
    // Zustand (nur im Speicher, wird beim Neuladen zurückgesetzt)
    let habits = [];
    let nextId = 1;

    const form = document.getElementById('habit-form');
    const input = document.getElementById('habit-input');
    const list = document.getElementById('habit-list');
    const emptyState = document.getElementById('empty');
    const percentEl = document.getElementById('percent');
    const fillEl = document.getElementById('fill');
    const noteEl = document.getElementById('note');
    const clearBtn = document.getElementById('clear-done');

    const CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    const CONFETTI_COLORS = ['#8b5cf6', '#22d3ee', '#34d399', '#f43f5e', '#fbbf24', '#f472b6'];

    function addHabit(name) {
      habits.push({ id: nextId++, name, done: false });
      render();
    }

    function toggleHabit(id, anchorEl) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      habit.done = !habit.done;

      // Konfetti nur beim Abhaken, solange das Element noch im DOM ist
      if (habit.done && anchorEl) {
        launchConfetti(anchorEl);
      }

      render();
    }

    function deleteHabit(id) {
      habits = habits.filter(h => h.id !== id);
      render();
    }

    function clearDoneHabits() {
      habits = habits.filter(h => !h.done);
      render();
    }

    function launchConfetti(anchorEl) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const rect = anchorEl.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      const particleCount = 28;

      for (let i = 0; i < particleCount; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
        piece.style.left = x + 'px';
        piece.style.top = y + 'px';
        piece.style.width = (6 + Math.random() * 6) + 'px';
        piece.style.height = (8 + Math.random() * 8) + 'px';
        document.body.appendChild(piece);

        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 90;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 60;
        const fall = 120 + Math.random() * 80;
        const rotation = (Math.random() * 720 - 360);

        const animation = piece.animate([
          { transform: 'translate(-50%, -50%) translate(0px, 0px) rotate(0deg)', opacity: 1 },
          { transform: `translate(-50%, -50%) translate(${dx}px, ${dy}px) rotate(${rotation / 2}deg)`, opacity: 1, offset: 0.4 },
          { transform: `translate(-50%, -50%) translate(${dx * 1.1}px, ${dy + fall}px) rotate(${rotation}deg)`, opacity: 0 }
        ], {
          duration: 900 + Math.random() * 500,
          easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)',
          fill: 'forwards'
        });

        animation.onfinish = () => piece.remove();
      }
    }

    function getMotivation(percent, total) {
      if (total === 0) return 'Füge deine erste Gewohnheit hinzu und starte heute.';
      if (percent === 100) return 'Perfekt! Alle Gewohnheiten für heute erledigt. 🎉';
      if (percent >= 50) return 'Mehr als die Hälfte geschafft. Weiter so!';
      if (percent > 0) return 'Guter Start. Bleib dran!';
      return 'Der Tag gehört dir. Hake die erste Gewohnheit ab.';
    }

    function render() {
      const total = habits.length;
      const doneCount = habits.filter(h => h.done).length;
      const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

      percentEl.textContent = percent + '%';
      fillEl.style.width = percent + '%';
      noteEl.textContent = getMotivation(percent, total);
      emptyState.hidden = total > 0;

      clearBtn.disabled = doneCount === 0;
      clearBtn.textContent = doneCount > 0 ? `Erledigte löschen (${doneCount})` : 'Erledigte löschen';

      list.innerHTML = '';

      habits.forEach(habit => {
        const li = document.createElement('li');
        if (habit.done) li.classList.add('done');

        const check = document.createElement('span');
        check.className = 'check';
        check.innerHTML = CHECK_SVG;

        const name = document.createElement('span');
        name.className = 'habit-name';
        name.textContent = habit.name;

        const del = document.createElement('button');
        del.className = 'btn-delete';
        del.type = 'button';
        del.title = 'Löschen';
        del.setAttribute('aria-label', 'Gewohnheit löschen');
        del.textContent = '×';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteHabit(habit.id);
        });

        li.addEventListener('click', () => toggleHabit(habit.id, check));

        li.append(check, name, del);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      addHabit(value);
      input.value = '';
      input.focus();
    });

    clearBtn.addEventListener('click', clearDoneHabits);

    render();
  </script>
</body>
</html>
