<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg: #0a0b10;
      --surface: #131620;
      --surface-2: #1b1f2d;
      --border: #242a3b;
      --text: #e8ebf5;
      --muted: #7a8299;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --success: #34d399;
      --danger: #f43f5e;
      --water: #22d3ee;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(139, 92, 246, 0.18), transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(34, 211, 238, 0.12), transparent 40%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 18px;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fff 30%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

      font-size: 0.85rem;
      color: var(--muted);
